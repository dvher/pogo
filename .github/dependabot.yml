version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Wails 3.1 drops GTK 3, which ends Ubuntu 22.04 support; upgrade by hand.
      - dependency-name: github.com/wailsapp/wails/v3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
